,145.6094 Q461.3102,145.6094 461.0446,145.375 Q460.779,145.1406 460.779,144.75 Q460.779,144.375 461.0446,144.1406 Q461.3102,143.9063 461.9196,143.9063 L463.6383,143.9063 L463.6383,137.25 L461.9196,137.25 Q461.3102,137.25 461.0446,137.0156 Q460.779,136.7813 460.779,136.3906 Q460.779,136.0156 461.0446,135.7813 Q461.3102,135.5469 461.9196,135.5469 L467.0602,135.5469 Q467.6696,135.5469 467.9352,135.7813 Q468.2008,136.0156 468.2008,136.3906 Q468.2008,136.7813 467.9352,137.0156 Q467.6696,137.25 467.0602,137.25 L465.3415,137.25 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="134.6201" x="482.808" y="146.3379">EnemyActionStrategy</text><line style="stroke:#000000;stroke-width:0.5;" x1="430.5" x2="639.3164" y1="156.6094" y2="156.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="198.8164" x="435.5" y="175.1426">+execute(enemy, players) : void</text></g><!--class BasicEnemyActionStrategy--><g id="elem_BasicEnemyActionStrategy"><rect codeLine="34" fill="#FFFFFF" height="57.6094" id="BasicEnemyActionStrategy" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.5;" width="210.8164" x="429.5" y="242.6094"/><ellipse cx="448.9829" cy="258.6094" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M451.7485,254.4844 Q451.9047,254.2656 452.0922,254.1563 Q452.2797,254.0469 452.4985,254.0469 Q452.8735,254.0469 453.1079,254.3125 Q453.3422,254.5625 453.3422,255.1719 L453.3422,256.625 Q453.3422,257.2344 453.1079,257.5 Q452.8735,257.7656 452.4985,257.7656 Q452.1547,257.7656 451.9516,257.5625 Q451.7485,257.375 451.6391,256.8594 Q451.5922,256.5 451.4047,256.3125 Q451.0766,255.9375 450.4672,255.7188 Q449.8579,255.5 449.2329,255.5 Q448.4672,255.5 447.8266,255.8281 Q447.2016,256.1563 446.7016,256.9063 Q446.2172,257.6563 446.2172,258.6875 L446.2172,259.7813 Q446.2172,261.0156 447.1079,261.8438 Q447.9985,262.6563 449.5922,262.6563 Q450.5297,262.6563 451.186,262.4063 Q451.5766,262.25 451.9985,261.8125 Q452.2641,261.5469 452.4047,261.4688 Q452.561,261.3906 452.7641,261.3906 Q453.0922,261.3906 453.3422,261.6563 Q453.6079,261.9063 453.6079,262.25 Q453.6079,262.5938 453.2641,263 Q452.7641,263.5781 451.9672,263.9063 Q450.8891,264.3594 449.5922,264.3594 Q448.0766,264.3594 446.8735,263.7344 Q445.8891,263.2344 445.2016,262.1719 Q444.5141,261.0938 444.5141,259.8125 L444.5141,258.6563 Q444.5141,257.3281 445.1235,256.1875 Q445.7485,255.0313 446.8422,254.4219 Q447.936,253.7969 449.1704,253.7969 Q449.9047,253.7969 450.5454,253.9688 Q451.2016,254.125 451.7485,254.4844 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.8545" x="463.9791" y="264.3379">BasicEnemyActionStrategy</text><line style="stroke:#000000;stroke-width:0.5;" x1="430.5" x2="639.3164" y1="274.6094" y2="274.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="198.8164" x="435.5" y="293.1426">+execute(enemy, players) : void</text></g><g id="elem_N1"><path d="M20,360.6094 L20,485.0703 A0,0 0 0 0 20,485.0703 L358.1606,485.0703 A0,0 0 0 0 358.1606,485.0703 L358.1606,370.6094 L348.1606,360.6094 L206,360.6094 L202,300.7194 L198,360.6094 L20,360.6094 A0,0 0 0 0 20,360.6094 " fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M348.1606,360.6094 L348.1606,370.6094 L358.1606,370.6094 L348.1606,360.6094 " fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="142.3145" x="26" y="379.1045">SpeedBasedTurnOrder</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.146" x="26" y="395.4561">Merges all living players and enemies into one list</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2578" x="26" y="411.8076">and sorts by speed in descending order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="26" y="428.1592">The player does NOT always go first &#8212; a faster enemy</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.1606" x="26" y="444.5107">(e.g. Wolf SPD=35) will act before a Warrior (SPD=30).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.1924" x="26" y="460.8623">GameState calls this at the start of every round via</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.6143" x="26" y="477.2139">newTurnOrder() to rebuild the queue.</text></g><g id="elem_N2"><path d="M393.5,376.6094 L393.5,468.3672 A0,0 0 0 0 393.5,468.3672 L738.9858,468.3672 A0,0 0 0 0 738.9858,468.3672 L738.9858,386.6094 L728.9858,376.6094 L539,376.6094 L535,300.7194 L531,376.6094 L393.5,376.6094 A0,0 0 0 0 393.5,376.6094 " fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M728.9858,376.6094 L728.9858,386.6094 L738.9858,386.6094 L728.9858,376.6094 " fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="169.7808" x="399.5" y="395.1045">BasicEnemyActionStrategy</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.8906" x="399.5" y="411.4561">Iterates the player list and attacks the first</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.4619" x="399.5" y="427.8076">alive player. Damage = max(0, ATK &#8722; target.DEF).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.0786" x="399.5" y="444.1592">Held as a field on each Enemy instance and invoked</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.4858" x="399.5" y="460.5107">by BattleEngine during the enemy phase of every round.</text></g><!--reverse link TurnOrderStrategy to SpeedBasedTurnOrder--><g id="link_TurnOrderStrategy_SpeedBasedTurnOrder"><path codeLine="39" d="M220,200.7794 C220,218.9294 220,224.1994 220,242.3694 " fill="none" id="TurnOrderStrategy-backto-SpeedBasedTurnOrder" style="stroke:#181818;stroke-width:1;stroke-dasharray:7.0,7.0;"/><polygon fill="none" points="220,182.7794,214,200.7794,226,200.7794,220,182.7794" style="stroke:#181818;stroke-width:1;"/></g><!--reverse link EnemyActionStrategy to BasicEnemyActionStrategy--><g id="link_EnemyActionStrategy_BasicEnemyActionStrategy"><path codeLine="40" d="M535,200.7794 C535,218.9294 535,224.1994 535,242.3694 " fill="none" id="EnemyActionStrategy-backto-BasicEnemyActionStrategy" style="stroke:#181818;stroke-width:1;stroke-dasharray:7.0,7.0;"/><polygon fill="none" points="535,182.7794,529,200.7794,541,200.7794,535,182.7794" style="stroke:#181818;stroke-width:1;"/></g><!--SRC=[hLHDJzj04BtxLupWagZ83K7fbm9IGf8MjK2bHEAyjYVs2dlNtHq7J8lKOyzLVo6_fBFh1099RlYIU7VcpRptPaoISeGf6K6Ord2kauhVMyAW4g5T7hU3m5vBLGeZ2eXpOUs0oCYe8ZoBjPhAEuJEMaWk5L9T8cX3cNwP2py3u6SeuklKw4ebfphN1guoITZSQ9EWQKw7EOS5zsiO9H-857UWx8-F9jt9Q0Dd_x3thdVQUOQaDEs4cKmce_7xJPZ9ny67RezXWamc25YKL4E1HOJ61i6gjxtd-krn5Gyb5Q6PYnXXLXbrwN0VfMyQSSyRY2gP9uyXhJ8NDUCV02ei9DesV89lqbB_L1UH8A7en2VVDrKQbQSbOZ8K5f-0Nh764vCnnzU3c2GFmZOkU8in3qhBuTO7iApZu1TQ9fjzSyioVXLGXjsK6Q3_AmnXcpp1jgfDzAwcWi0FaR1mSRWsDFteP0j-_staD3n7aw85aUUyA0kfqbNx85Ioajy9h44hv1XBdENkBE-JXQW6wy0v11AqCQh4WVWf3Jbobk4I4HBDI1UNCovs8seBgOQvD9RWuVS_430Nbbtq9MjER66OXd2bypbClu-EZtfjk97SfOW98fnhmqJXIXWZUHDQFgJJTXK_YmAdn890pAmiK2QP3F4lWYLX2FGSS86c1hzZi922qnJUFCrV6vYlGJ-LFl57XHM60RFpYnficsUsvk9mpOFkSmzskROquep9yxlrvPQAERMzreA8bxcvyvev3zYlLMG88r6uNJ-6GjosEWSmc7s5Xpz_WGcdIE5eFF7YV44cnCsntDBzrGfGn5cpD-mX2wHuZLnDgHRw6jtuiiT3xY37iKhvOmf9PPp7hXdl5fGPA_52rZMnTYwHKwmR_0S0]--></