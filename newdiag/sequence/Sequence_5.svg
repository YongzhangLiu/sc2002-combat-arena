DD" style="stroke:#181818;stroke-width:0.5;"/><path d="M411,190.625 L411,200.625 L421,200.625 L411,190.625 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.6626" x="201" y="209.1201">Iterates activeEffects</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.207" x="201" y="225.4717">calls StunEffect.onTurnStart(goblin)</text><polygon fill="#181818" points="432.5869,256.6797,442.5869,260.6797,432.5869,264.6797,436.5869,260.6797" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="308.5889" x2="438.5869" y1="260.6797" y2="260.6797"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111.998" x="315.5889" y="255.8232">onTurnStart(goblin)</text><path d="M365,273.6797 L365,332.6797 L522,332.6797 L522,283.6797 L512,273.6797 L365,273.6797 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M512,273.6797 L512,283.6797 L522,283.6797 L512,273.6797 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.3599" x="371" y="292.1748">remainingTurns &gt; 0</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.9189" x="371" y="308.5264">remainingTurns-- (2&#8594;1)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.3735" x="371" y="324.8779">return true (skip turn)</text><polygon fill="#181818" points="319.5889,356.0859,309.5889,360.0859,319.5889,364.0859,315.5889,360.0859" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="313.5889" x2="443.5869" y1="360.0859" y2="360.0859"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing"